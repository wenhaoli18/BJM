url: https://wenhaoli18.github.io/BJM/

template:
  bootstrap: 5

authors:
  Wenhao Li:
    html: 'Wenhao Li &lt;<a href="mailto:wenhaoli.jlu@gmail.com">wenhaoli.jlu@gmail.com</a>&gt;'
  Liang Li:
    html: 'Liang Li &lt;<a href="mailto:LLi15@mdanderson.org">LLi15@mdanderson.org</a>&gt;'

reference:
- title: Fit sub-models
  desc: Fit the survival and longitudinal sub-models that dynamic prediction is built on.
  contents:
  - survivalSub
  - longitudinalSub

- title: Dynamic prediction
  desc: Predict event risk and future biomarker values from the fitted sub-models.
  contents:
  - predictRisk
  - predictLongitudinal
  - simulateTrajectory
  - checkBandcountConvergence
  - survivalTrans

- title: Interval-censored events
  desc: Fit the backward joint model when the event time is only known to lie between two visits.
  contents:
  - fitIntervalBJM

- title: Recurrent events (experimental)
  desc: Reshape recurrent-event data for the gap-time extension of the backward joint model, and predict the number of recurrences.
  contents:
  - buildRecurrentEpisodes
  - predictRecurrentCount

- title: Missing data imputation
  desc: Impute missing longitudinal biomarker values and pool sub-model fits across imputations.
  contents:
  - imputeLongitudinal
  - poolLongitudinalSub

- title: Plots
  desc: Visualize predictions, fitted sub-models, observed longitudinal trajectories, and observed event outcomes.
  contents:
  - predictPlot
  - riskPlot
  - cmtPlot
  - spaghettiPlot
  - cifPlot
  - performancePlot
  - calibrationPlot
  - plot.longitudinalSub.BJM
  - plot.survivalSub.BJM
  - plot.predictLongitudinal.BJM
  - plot.simulateTrajectory.BJM

- title: Data
  contents:
  - pbc3

articles:
- title: Basics
  desc: Fit the two sub-models, predict with or without competing risks, plot, and write the longitudinal formulas.
  contents:
  - BJM-intro
  - articles/competing-risks
  - articles/plotting
  - nonlinear-terms

- title: Extensions
  desc: Categorical biomarkers, and events that are interval-censored or recur, and simulated digital twins.
  contents:
  - articles/categorical-biomarkers
  - articles/interval-censoring
  - articles/recurrent-events
  - articles/digital-twins

navbar:
  structure:
    left: [intro, articles, extensions, reference, news]
  components:
    articles:
      text: Articles
      menu:
      - text: Getting started with BJM
        href: articles/BJM-intro.html
      - text: Competing risks
        href: articles/competing-risks.html
      - text: Plotting with BJM
        href: articles/plotting.html
      - text: Nonlinear terms in longitudinal formulas
        href: articles/nonlinear-terms.html
    extensions:
      text: Extensions
      menu:
      - text: Categorical biomarkers
        href: articles/categorical-biomarkers.html
      - text: Interval-censored events
        href: articles/interval-censoring.html
      - text: Recurrent events
        href: articles/recurrent-events.html
      - text: Digital twins
        href: articles/digital-twins.html
