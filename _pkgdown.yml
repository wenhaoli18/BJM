url: https://wenhaoli18.github.io/BJM/

template:
  bootstrap: 5

authors:
  Wenhao Li:
    html: 'Wenhao Li &lt;<a href="mailto:wenhaoli.jlu@gmail.com">wenhaoli.jlu@gmail.com</a>&gt;'
  Liang Li:
    html: 'Liang Li &lt;<a href="mailto:LLi15@mdanderson.org">LLi15@mdanderson.org</a>&gt;'

reference:
- title: Fit sub-models
  desc: Fit the survival and longitudinal sub-models that dynamic prediction is built on.
  contents:
  - survivalSub
  - longitudinalSub

- title: Dynamic prediction
  desc: Predict event risk and future biomarker values from the fitted sub-models.
  contents:
  - predictRisk
  - predictLongitudinal
  - simulateTrajectory
  - checkBandcountConvergence
  - survivalTrans

- title: Interval-censored events (experimental)
  desc: Fit the backward joint model when the event time is only known to lie between two visits.
  contents:
  - fitIntervalBJM

- title: Missing data imputation
  desc: Impute missing longitudinal biomarker values and pool sub-model fits across imputations.
  contents:
  - imputeLongitudinal
  - poolLongitudinalSub

- title: Plots
  desc: Visualize predictions, fitted sub-models, observed longitudinal trajectories, and observed event outcomes.
  contents:
  - predictPlot
  - riskPlot
  - cmtPlot
  - spaghettiPlot
  - cifPlot
  - performancePlot
  - calibrationPlot
  - plot.longitudinalSub.BJM
  - plot.survivalSub.BJM
  - plot.predictLongitudinal.BJM
  - plot.simulateTrajectory.BJM

- title: Data
  contents:
  - pbc3

navbar:
  structure:
    left: [intro, articles, reference, news]
